[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-android-tool"
version = "0.1.0"
description = "Python package for fetching, building, installing, and interacting with Linux kernels on Android devices"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "abmoha2026-coder" }]
license = { text = "MIT" }
keywords = ["android", "linux", "kernel", "adb", "fastboot"]

[project.scripts]
kernel-android-tool = "kernel_android_tool.cli:main"

[tool.setuptools]
packages = ["kernel_android_tool"]
